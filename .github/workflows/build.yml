name: Test and build XPI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Check XPI archive
        run: unzip -t build/*.xpi
      - name: Upload installable XPI
        id: xpi
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: build/*.xpi
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Link testing download
        env:
          XPI_URL: ${{ steps.xpi.outputs.artifact-url }}
        run: |
          printf '[Download the XPI](%s) and install it from Zotero → Tools → Plugins.\n' "$XPI_URL" >> "$GITHUB_STEP_SUMMARY"
